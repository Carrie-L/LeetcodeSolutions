name: Sync Leetcode

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  schedule:
    - cron: "0 8 * * 6"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Sync
        uses: joshcai/leetcode-sync@v1.7
        with:
          github-token: ${{ github.token }}
          leetcode-csrf-token: ${{ secrets.csrftoken }}
          leetcode-session: ${{ secrets.LEETCODE_SESSION }}
          destination-folder: leetcode_sync
          verbose: true
          single-commit: true
          language-filter: kotlin
          use-slug-folder: true
          commit-header: "[LeetCode Sync]"